# Builds the app on every push to main and publishes it as the "latest" release,
# so the TV can download it directly:
# https://github.com/matthope001-hub/HomeIPTV/releases/latest/download/TVDash.apk
name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Build
        run: gradle assembleDebug --no-daemon
      - name: Publish as latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk TVDash.apk
          gh release delete latest -y --cleanup-tag || true
          gh release create latest TVDash.apk --title "TV Dash (latest)" \
            --notes "Built from ${GITHUB_SHA::7}. Download on the TV with the Downloader app, see INSTALL.md."
