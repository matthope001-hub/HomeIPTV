# Builds the app on every push to main and saves it as apk/tvdash.apk in the repo,
# so the TV can download it directly:
# https://raw.githubusercontent.com/matthope001-hub/HomeIPTV/main/apk/tvdash.apk
name: Build APK

on:
  push:
    branches: [main]
    paths-ignore: ["apk/**"]
  workflow_dispatch:

permissions:
  contents: write

# One build publishes at a time, so two quick pushes can't remove each other's download
concurrency:
  group: publish-apk
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Build
        run: gradle assembleDebug --no-daemon
      - name: Save the APK in the repo
        run: |
          set -x
          mkdir -p apk
          cp app/build/outputs/apk/debug/app-debug.apk apk/tvdash.apk
          echo "${GITHUB_RUN_NUMBER}" > apk/version.txt   # the app compares this with its own build number
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apk/tvdash.apk apk/version.txt
          git commit -m "Build APK from ${GITHUB_SHA::7} [skip ci]" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
